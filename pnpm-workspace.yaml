packages:
  - apps/*
  - packages/*
allowBuilds:
  "@scarf/scarf": false
  msgpackr-extract: false
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@nestjs/common@12.2.0"
  - "@nestjs/core@12.2.0"
  - "@nestjs/platform-express@12.2.0"
  - bullmq@6.3.17
